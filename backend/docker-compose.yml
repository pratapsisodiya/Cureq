version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinically_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=clinically_user
      - DB_PASSWORD=clinically_pass
      - DB_NAME=clinically_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - clinically_network
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:15-alpine
    container_name: clinically_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinically_user
      POSTGRES_PASSWORD: clinically_pass
      POSTGRES_DB: clinically_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clinically_network

  redis:
    image: redis:7-alpine
    container_name: clinically_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - clinically_network

networks:
  clinically_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
